<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.4"/>
  
  <!-- DNA Double Helix / Plant Leaf Biology Emblem -->
  <g transform="translate(256, 210)" filter="url(#glow)">
    <!-- Stylized Leaf & DNA Nodes -->
    <path d="M-60,50 C-110,-40 0,-130 0,-130 C0,-130 110,-40 60,50 C30,95 -30,95 -60,50 Z" fill="url(#accent)" opacity="0.95"/>
    <path d="M0,-120 C-5,-60 -5,20 0,60" stroke="#022c22" stroke-width="8" stroke-linecap="round"/>
    <path d="M0,-60 C-25,-40 -35,-30 -35,-30" stroke="#022c22" stroke-width="5" stroke-linecap="round"/>
    <path d="M0,-20 C25,0 35,10 35,10" stroke="#022c22" stroke-width="5" stroke-linecap="round"/>
    <path d="M0,20 C-20,35 -28,42 -28,42" stroke="#022c22" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Code 5090 Banner -->
  <rect x="136" y="340" width="240" height="66" rx="20" fill="#020617" stroke="#10b981" stroke-width="4" stroke-opacity="0.8"/>
  <text x="256" y="386" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="40" letter-spacing="4" text-anchor="middle">5090</text>
  <text x="256" y="445" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" letter-spacing="2" text-anchor="middle">O LEVEL BIOLOGY</text>
</svg>
